plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.expensetracker'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.expensetracker"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

//for navbar worrnings
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xlint:deprecation"]
}

dependencies {
    // Source: https://mvnrepository.com/artifact/android.piechart/piechart
//    implementation("android.piechart:piechart:1.0.2")
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    implementation 'com.intuit.sdp:sdp-android:1.1.1' //for sdp
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'  //for chart
}